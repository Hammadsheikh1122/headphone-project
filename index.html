<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headphone Product</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>🎧 Headphone Store</h1>

        <div class="card">

            <!-- Product Image -->
            <img 
                id="productImage"
                src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600"
                alt="Headphone"
            >

            <!-- Product Information -->
            <h2 id="productName">Premium Wireless Headphones</h2>

            <p id="productDescription">
                Enjoy high-quality sound with comfortable wireless headphones.
            </p>

            <h3 id="productPrice">$99</h3>

            <!-- Buy Now -->
            <button id="buyBtn">Buy Now</button>

            <p id="message"></p>

            <hr>

            <!-- Name Input -->
            <input 
                type="text" 
                id="userName" 
                placeholder="Enter your name"
            >

            <button id="welcomeBtn">Welcome Me</button>

            <h3 id="welcomeMessage"></h3>

            <!-- Change Product -->
            <button id="changeProductBtn">
                Change Product
            </button>

        </div>

    </div>

    <script src="app,js"></script>
</body>
</html>
